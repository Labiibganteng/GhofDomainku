<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GhofDomainku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 40px 8%;">

    <div id="adminLoginBox" class="glow-card" style="max-width: 400px; margin: 100px auto; padding: 30px;">
        <h2>🔒 Login Admin</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 15px;">Khusus pencipta: anakbahasainternational@gmail.com</p>
        <input type="email" id="adminEmail" placeholder="Masukkan Email Admin">
        <button class="btn" style="width:100%; margin-top:10px;" onclick="verifyAdmin()">Masuk Panel</button>
    </div>

    <div id="adminDashboard" style="display:none;">
        <h1>👑 Admin Panel GhofDomainku</h1>
        <p style="color: var(--text-muted);">Kontrol penuh sistem, pengguna, harga, dan pengaturan aplikasi.</p>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px;">
            
            <div class="glow-card" style="padding: 20px;">
                <h3>📊 Statistik & Rating</h3>
                <label>Ubah Rating Web:</label>
                <input type="text" id="setRating" value="4.9/5.0">
                <label>Ubah Jumlah Pengguna Aktif:</label>
                <input type="text" id="setUsersCount" value="12,450+">
                <button class="btn" style="margin-top:10px;" onclick="updateStats()">Simpan Statistik</button>
            </div>

            <div class="glow-card" style="padding: 20px;">
                <h3>💳 Metode Pembayaran</h3>
                <p style="font-size:14px; color:var(--text-muted);">Nomor saat ini: DANA / ShopeePay (08979517541)</p>
                <label>Ubah Nomor Pembayaran:</label>
                <input type="text" id="setPayNumber" value="08979517541">
                <button class="btn" style="margin-top:10px;" onclick="updatePayment()">Simpan Nomor</button>
            </div>

        </div>

        <div style="margin-top: 30px;">
            <button class="btn" style="background:#ef4444;" onclick="logoutAdmin()">Keluar Admin</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
